<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wapas Shop</title>
<style>
:root{--paper:#F7F6F2;--ink:#0B1220;--body:#3D4654;--muted:#5F6773;--rule:#D9D6CE;--acc:#1746C8;--green:#0F7A4B;--amb:#7A4300;--ambt:#FFF4E0}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,'Segoe UI',system-ui,sans-serif}header{background:var(--ink);color:#F2F1EC;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}header b{font-size:20px}header span{color:#A3ACBA;font-size:12px}
main{max-width:940px;margin:0 auto;padding:18px}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);gap:14px;align-items:start}.products,.cart{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:16px}.products h2,.cart h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}.item{border:1px solid var(--rule);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px}.item b{font-size:14px}.item .price{font-size:18px;font-weight:700}.muted{color:var(--muted);font-size:12px}.item button,button{border:0;border-radius:10px;padding:10px 12px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}.item button{margin-top:auto}.item button:disabled,button:disabled{opacity:.5;cursor:not-allowed}.cart-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid #EEECE6}.cart-row small{display:block;color:var(--muted)}.qty{width:72px;padding:7px;border:1px solid #C9CCD3;border-radius:8px}form{display:grid;gap:9px;margin-top:12px}label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}input,select{display:block;width:100%;padding:10px;border:1px solid #C9CCD3;border-radius:9px;margin-top:4px;font:14px inherit}.total{display:flex;justify-content:space-between;border-top:1px solid var(--rule);padding-top:12px;margin-top:10px;font-size:16px;font-weight:700}.note{background:var(--ambt);color:var(--amb);border-radius:8px;padding:9px;font-size:12px;line-height:1.4}.err{color:#A4262C;font-size:12px;min-height:16px}.empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 8px}
@media(max-width:720px){.layout{grid-template-columns:1fr}main{padding:12px}.cart{order:-1}}
</style></head>
<body><header><b id="store-name">Store</b><span>Order status is checked with Wapas after Paytm confirms</span></header>
<main><div class="layout"><section class="products"><h2>Products</h2><form id="product-search"><label>Search this store<input name="q" maxlength="80" minlength="2" placeholder="Search for a product"></label><button type="submit">Search</button><button type="button" id="clear-search">Show all products</button><p class="muted" id="search-message" aria-live="polite"></p></form><div class="grid" id="products"></div><p class="empty" id="products-empty" hidden>No in-stock products are listed right now.</p></section>
<section class="cart"><h2>Your cart</h2><div id="cart"><p class="empty">Your cart is empty.</p></div><div class="total"><span>Total</span><span id="total">₹0.00</span></div>
<form id="checkout"><label>Name<input name="name" required minlength="2" maxlength="60" autocomplete="name"></label><label>Mobile number<input name="phone" required inputmode="numeric" pattern="[6-9][0-9]{9}" autocomplete="tel"></label>
<label>Language<select name="language"><option value="en">English</option><option value="hi">Hindi</option><option value="kn">Kannada</option><option value="ta">Tamil</option><option value="te">Telugu</option></select></label>
<div class="note">Stock is held for this checkout. Payment is shown as confirmed only after Wapas verifies the Paytm status and amount.</div><button id="pay" type="submit" disabled>Continue to Paytm</button><p class="err" id="error" aria-live="polite"></p></form></section></div></main>
<script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=decodeURIComponent(location.pathname.split("/").filter(Boolean).pop()||"");
let products=[],cart={};
const productsRoot=document.getElementById("products"),cartRoot=document.getElementById("cart"),error=document.getElementById("error");
const paise=value=>`${Math.floor(value/100).toLocaleString("en-IN")}.${String(value%100).padStart(2,"0")}`;
function render(){
  const entries=Object.entries(cart).filter(([,q])=>Number(q)>0);
  cartRoot.innerHTML=entries.length?entries.map(([id,q])=>{const p=products.find(x=>x.id===id);return p?`<div class="cart-row"><div><b>${esc(p.name)}</b><small>₹${esc(p.price_fmt)} per ${esc(p.unit)} · ${esc(q)} ${esc(p.unit)}</small></div><input class="qty" type="number" min="0.001" step="0.001" max="${esc(p.available)}" value="${esc(q)}" data-qty="${esc(id)}" aria-label="Quantity of ${esc(p.name)}"></div>`:""}).join(""):`<p class="empty">Your cart is empty.</p>`;
  const sum=entries.reduce((n,[id,q])=>{const p=products.find(x=>x.id===id);return n+(p?Math.round(Number(q)*p.unit_price_paise):0)},0);
  document.getElementById("total").textContent="₹"+paise(sum);
  document.getElementById("pay").disabled=!entries.length;
  document.querySelectorAll("[data-qty]").forEach(el=>el.onchange=()=>{cart[el.dataset.qty]=el.value;render()});
}
function renderProducts(rows){document.getElementById("products-empty").hidden=rows.length>0;productsRoot.innerHTML=rows.map(p=>{const soldOut=p.availability==="OUT_OF_STOCK";return `<article class="item"><b>${esc(p.name)}</b><span class="muted">${esc(p.category||"")} · ${esc(p.unit)}</span><span class="price">₹${esc(p.price_fmt)}</span><span class="muted">${soldOut?"Currently out of stock":p.is_service?"Service":"Available: "+esc(p.available)+" "+esc(p.unit)}</span><button data-add="${esc(p.id)}" ${soldOut?"disabled":""}>${soldOut?"Unavailable":"Add to cart"}</button></article>`}).join("");document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===b.dataset.add);if(!p)return;const next=Number(cart[p.id]||0)+1;if(!p.is_service&&next>Number(p.available)){error.textContent="That quantity is not available.";return;}cart[p.id]=String(next);error.textContent="";render()})}
async function load(){try{const r=await fetch(`/api/public/stores/${encodeURIComponent(slug)}/products`);const d=await r.json();if(!r.ok)throw new Error(d.detail||"Store unavailable");document.getElementById("store-name").textContent=d.store;products=d.products;renderProducts(products);render();}catch(e){document.getElementById("products-empty").hidden=false;document.getElementById("products-empty").textContent=e.message}}
document.getElementById("product-search").onsubmit=async e=>{e.preventDefault();const q=e.currentTarget.elements.q.value.trim(),message=document.getElementById("search-message");message.textContent="Searching…";try{const r=await fetch(`/api/public/stores/${encodeURIComponent(slug)}/search?q=${encodeURIComponent(q)}`);const d=await r.json();if(!r.ok)throw new Error(d.detail||"Search failed");renderProducts(d.products);message.textContent=d.outcome==="NO_MATCH"?"No matching product is listed. The search was recorded for the merchant to review.":d.outcome==="OUT_OF_STOCK"?"This product is currently out of stock. The search was recorded for the merchant to review.":"Matching products";}catch(err){message.textContent=err.message}};
document.getElementById("clear-search").onclick=()=>{document.getElementById("product-search").reset();document.getElementById("search-message").textContent="";renderProducts(products)};
function randomToken(){const bytes=crypto.getRandomValues(new Uint8Array(32));let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"")}
function startPaytm(data){const script=document.createElement("script");script.src=data.script_url;script.crossOrigin="anonymous";script.onload=()=>{const config={root:"",flow:"DEFAULT",merchant:{redirect:true},data:{orderId:data.order_id,token:data.txn_token,tokenType:"TXN_TOKEN",amount:data.amount},handler:{notifyMerchant:(_name,_result)=>{}}};const begin=()=>window.Paytm.CheckoutJS.init(config).then(()=>window.Paytm.CheckoutJS.invoke()).catch(()=>{error.textContent="Paytm checkout could not open. Check the order status before trying again."});if(window.Paytm?.CheckoutJS?.onLoad)window.Paytm.CheckoutJS.onLoad(begin);else begin()};script.onerror=()=>{error.textContent="Paytm checkout could not load. Check the order status before trying again."};document.head.appendChild(script)}
document.getElementById("checkout").onsubmit=async e=>{e.preventDefault();error.textContent="";const button=document.getElementById("pay");button.disabled=true;let token,idempotency;try{token=localStorage.getItem("wapas_checkout_token")||randomToken();idempotency=localStorage.getItem("wapas_checkout_key")||("shop_"+randomToken())}catch{error.textContent="Secure checkout is unavailable in this browser.";button.disabled=false;return;}const lines=Object.entries(cart).filter(([,q])=>Number(q)>0).map(([product_id,quantity])=>({product_id,quantity}));const f=e.currentTarget.elements;localStorage.setItem("wapas_checkout_key",idempotency);localStorage.setItem("wapas_checkout_token",token);try{const r=await fetch(`/api/public/stores/${encodeURIComponent(slug)}/checkout`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:f.name.value,phone:f.phone.value,language:f.language.value,items:lines,idempotency_key:idempotency,order_token:token})});const d=await r.json();if(!r.ok)throw new Error(d.detail||"Could not start checkout");localStorage.setItem("wapas_order_token:"+d.order_id,token);localStorage.removeItem("wapas_checkout_key");localStorage.removeItem("wapas_checkout_token");if(d.mode==="fake"&&d.url){location.href=d.url;return;}if(d.mode==="paytm"&&d.txn_token){startPaytm(d);return;}location.href=d.result_url||(`/shop/result/${encodeURIComponent(d.order_id)}`)}catch(err){error.textContent=err.message;button.disabled=false}};
load();
</script></body></html>
