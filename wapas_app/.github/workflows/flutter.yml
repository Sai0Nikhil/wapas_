name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: wapas_app
        run: flutter pub get

      - name: Analyze code
        working-directory: wapas_app
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        working-directory: wapas_app
        run: flutter test
